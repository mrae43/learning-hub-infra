name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 1. THE DETECTOR JOB
  detect-changes:
    name: Check modified packages
    runs-on: ubuntu-latest
    outputs:
      # Exposes the list of changed packages as a JSON array output
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # If global config changes, we force ALL packages to test.
          # Otherwise, a package only runs if its specific folder changes.
          filters: |
            core:
              - 'core/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            retrieval_qa:
              - 'retrieval_qa/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            depth_dive:
              - 'depth_dive/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            ingestion:
              - 'ingestion/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  # 2. THE QUALITY JOB (DYNAMIC MATRIX)
  quality:
    name: ${{ matrix.package }} — lint, typecheck, tests
    needs: detect-changes
    # Only spin up this job if the detector found relevant code changes
    if: ${{ needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: learning_hub
          POSTGRES_PASSWORD: learning_hub
          POSTGRES_DB: learning_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_hub -d learning_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://learning_hub:learning_hub@localhost:5432/learning_hub
    strategy:
      fail-fast: false
      matrix:
        # Converts the string output '["api", "core"]' into a live GitHub Actions matrix
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          enable-cache: true
          
      - name: Sync dependencies
        run: uv sync --all-packages
        
      - name: Ruff lint
        run: uv run ruff check ${{ matrix.package }}
        
      - name: Ruff format
        run: uv run ruff format --check ${{ matrix.package }}
        
      - name: Mypy
        run: uv run mypy ${{ matrix.package }}
        
      - name: Pytest
        run: uv run pytest ${{ matrix.package }}

  # 3. MODULE BOUNDARIES
  boundaries:
    name: import-linter module boundaries
    needs: detect-changes
    # Run the architectural linter if any code or core setup changes
    if: ${{ needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          enable-cache: true
          
      - name: Sync dependencies
        run: uv sync --all-packages
        
      - name: Import-linter
        run: uv run lint-imports

  # 4. COMMIT LINT
  commitlint:
    name: commit message format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

  # 5. WORKFLOW-VALIDATION GATE (actionlint)
  # Lints every workflow definition in .github/workflows/ so malformed YAML
  # fails the merge gate here instead of breaking a run at trigger time.
  actionlint:
    name: actionlint workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download actionlint
        run: |
          bash <(curl -Ls https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          install -m 0755 ./actionlint /usr/local/bin/actionlint

      - name: Lint workflow files
        run: actionlint -color

  # 6. AGGREGATE GATE (single predictable check name for ruleset)
  ci-passed:
    name: CI passed
    if: always()
    needs: [detect-changes, quality, boundaries, commitlint, actionlint]
    runs-on: ubuntu-latest
    steps:
      - name: Check all prerequisites passed
        env:
          DETECT: ${{ needs.detect-changes.result }}
          QUALITY: ${{ needs.quality.result }}
          BOUNDARIES: ${{ needs.boundaries.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
        run: |
          for result in "$DETECT" "$QUALITY" "$BOUNDARIES" "$COMMITLINT" "$ACTIONLINT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
