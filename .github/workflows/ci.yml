name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 1. THE DETECTOR JOB
  detect-changes:
    name: Check modified packages
    runs-on: ubuntu-latest
    outputs:
      # Exposes the list of changed packages as a JSON array output
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # If global config changes, we force ALL packages to test.
          # Otherwise, a package only runs if its specific folder changes.
          filters: |
            core:
              - 'core/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            retrieval_qa:
              - 'retrieval_qa/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            depth_dive:
              - 'depth_dive/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            ingestion:
              - 'ingestion/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  # 2. THE QUALITY JOB (DYNAMIC MATRIX)
  quality:
    name: ${{ matrix.package }} — lint, typecheck, tests
    needs: detect-changes
    # Only spin up this job if the detector found relevant code changes
    if: ${{ needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: learning_hub
          POSTGRES_PASSWORD: learning_hub
          POSTGRES_DB: learning_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_hub -d learning_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://learning_hub:learning_hub@localhost:5432/learning_hub
    strategy:
      fail-fast: false
      matrix:
        # Converts the string output '["api", "core"]' into a live GitHub Actions matrix
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          enable-cache: true
          
      - name: Sync dependencies
        run: uv sync --all-packages
        
      - name: Ruff lint
        run: uv run ruff check ${{ matrix.package }}
        
      - name: Ruff format
        run: uv run ruff format --check ${{ matrix.package }}
        
      - name: Mypy
        run: uv run mypy ${{ matrix.package }}
        
      - name: Pytest
        run: uv run pytest ${{ matrix.package }}

  # 3. MODULE BOUNDARIES
  boundaries:
    name: import-linter module boundaries
    needs: detect-changes
    # Run the architectural linter if any code or core setup changes
    if: ${{ needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          enable-cache: true
          
      - name: Sync dependencies
        run: uv sync --all-packages
        
      - name: Import-linter
        run: uv run lint-imports

  # 4. COMMIT LINT
  commitlint:
    name: commit message format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

  # 5. WORKFLOW-VALIDATION GATE (actionlint)
  # Lints every workflow definition in .github/workflows/ so malformed YAML
  # fails the merge gate here instead of breaking a run at trigger time.
  actionlint:
    name: actionlint workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download actionlint
        run: |
          bash <(curl -Ls https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          install -m 0755 ./actionlint /usr/local/bin/actionlint

      - name: Lint workflow files
        run: actionlint -color

  # 6. DOCKER BUILD GATE (build-only, never pushes)
  # Catches Dockerfile breakage pre-merge instead of on `main` or at release
  # time. Runs unconditionally, like the workflow-validation gate. Uses the same
  # bare GHA cache backend (default repo-wide scope) as the release workflow.
  # Note: GitHub's cache access rules still isolate caches by branch/ref. A PR
  # run reads cache from its own merge-ref plus the base and default branches,
  # but only writes to its own merge-ref (`refs/pull/<N>/merge`); a `main`/tag
  # release run reads and writes only its own branch cache. So PR builds can
  # reuse (read) the release pipeline's cache but can never write back to it —
  # this gate validates the build, it does not warm the release cache. No
  # registry login, no push capability, no secrets.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (push disabled)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 7. AGGREGATE GATE (single predictable check name for ruleset)
  # The `needs:` list below is the SINGLE source of truth for which jobs gate
  # a merge. A new gate joins the aggregate simply by being listed here — the
  # pass/fail check rolls over every dependency via the `needs.*.result`
  # wildcard, so no separate env mapping or switch list needs to stay in sync.
  ci-passed:
    name: CI passed
    if: always()
    needs: [detect-changes, quality, boundaries, commitlint, actionlint, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check all prerequisites passed
        # Fails the gate if any listed dependency ends in failure or was
        # cancelled. When every dependency passes, this step is skipped and the
        # job reports success. `skipped` results (conditional jobs that did not
        # run) are intentionally NOT treated as failures.
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
