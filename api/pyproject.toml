[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "core",
    "depth-dive",
    "ingestion",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
core = { workspace = true }
depth-dive = { workspace = true }
ingestion = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
