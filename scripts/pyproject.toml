[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "core",
    "retrieval-qa",
    "ingestion",
    "pyyaml>=6.0",
    "requests>=2.34",
    "sqlalchemy>=2",
]

[tool.uv.sources]
core = { workspace = true }
retrieval-qa = { workspace = true }
ingestion = { workspace = true }

[tool.setuptools]
package-dir = {"scripts" = "."}
packages = ["scripts"]
