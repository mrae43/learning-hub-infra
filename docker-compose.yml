services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: learning_hub
      POSTGRES_PASSWORD: learning_hub
      POSTGRES_DB: learning_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_hub -d learning_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-upstream:
    build:
      context: .
      dockerfile: mock_upstream/Dockerfile
    profiles: ["load"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MOCK_LATENCY_ENABLED: ${MOCK_LATENCY_ENABLED:-true}
      MOCK_EMBEDDINGS_LATENCY_MIN_MS: ${MOCK_EMBEDDINGS_LATENCY_MIN_MS:-30}
      MOCK_EMBEDDINGS_LATENCY_MAX_MS: ${MOCK_EMBEDDINGS_LATENCY_MAX_MS:-80}
      MOCK_CHAT_LATENCY_MIN_MS: ${MOCK_CHAT_LATENCY_MIN_MS:-150}
      MOCK_CHAT_LATENCY_MAX_MS: ${MOCK_CHAT_LATENCY_MAX_MS:-400}
      MOCK_WEB_SEARCH_LATENCY_MIN_MS: ${MOCK_WEB_SEARCH_LATENCY_MIN_MS:-150}
      MOCK_WEB_SEARCH_LATENCY_MAX_MS: ${MOCK_WEB_SEARCH_LATENCY_MAX_MS:-400}

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://learning_hub:learning_hub@postgres:5432/learning_hub
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
