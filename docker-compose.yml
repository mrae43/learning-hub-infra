services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: learning_hub
      POSTGRES_PASSWORD: learning_hub
      POSTGRES_DB: learning_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_hub -d learning_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-upstream:
    build:
      context: .
      dockerfile: mock_upstream/Dockerfile
    profiles: ["load"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MOCK_LATENCY_ENABLED: ${MOCK_LATENCY_ENABLED:-true}
      MOCK_EMBEDDINGS_LATENCY_MIN_MS: ${MOCK_EMBEDDINGS_LATENCY_MIN_MS:-30}
      MOCK_EMBEDDINGS_LATENCY_MAX_MS: ${MOCK_EMBEDDINGS_LATENCY_MAX_MS:-80}
      MOCK_CHAT_LATENCY_MIN_MS: ${MOCK_CHAT_LATENCY_MIN_MS:-150}
      MOCK_CHAT_LATENCY_MAX_MS: ${MOCK_CHAT_LATENCY_MAX_MS:-400}
      MOCK_WEB_SEARCH_LATENCY_MIN_MS: ${MOCK_WEB_SEARCH_LATENCY_MIN_MS:-150}
      MOCK_WEB_SEARCH_LATENCY_MAX_MS: ${MOCK_WEB_SEARCH_LATENCY_MAX_MS:-400}

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://learning_hub:learning_hub@postgres:5432/learning_hub
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      # OTLP/HTTP export target for the RAG stage spans. Empty by default
      # (instrumentation inert); the observability profile points it at the
      # collector (make up-observability).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-learning-hub}
    depends_on:
      postgres:
        condition: service_healthy

  # Metrics path (issue #289): the collector receives the api's OTLP/HTTP
  # spans, derives RED metrics via the span_metrics connector, and serves them
  # on :8889/metrics for Prometheus. All three services are gated behind the
  # `observability` profile — dev-minimal (`make up`) stays untouched.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro

  prometheus:
    image: prom/prometheus:v3
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:13.1
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
