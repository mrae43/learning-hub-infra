# Grafana dashboard provisioning (issue #289). Dashboards-as-code live in
# observability/grafana/dashboards/*.json, mounted read-only into the Grafana
# container at /var/lib/grafana/dashboards and provisioned on startup.
apiVersion: 1

providers:
  - name: dashboards-as-code
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
