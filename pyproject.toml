[project]
name = "learning-hub"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "retrieval_qa", "depth_dive", "api", "ingestion", "scripts"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=1.11",
    "pytest>=8",
    "import-linter>=2.1",
    "pip-licenses>=5",
    "httpx2>=2.9.1",
    "reportlab>=4.0",
    "types-reportlab>=4.5.1.20260724",
    "deepeval>=4.1.3",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["core", "retrieval_qa", "depth_dive", "api", "ingestion", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["core/src", "retrieval_qa/src", "depth_dive/src", "api/src", "ingestion/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "integration: runs against real APIs and real Postgres, costs money, excluded from default CI runs",
]
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning",
]

[tool.importlinter]
root_packages = ["core", "retrieval_qa", "depth_dive", "api", "ingestion"]

[[tool.importlinter.contracts]]
name = "retrieval_qa and depth_dive must not import each other"
type = "independence"
modules = ["retrieval_qa", "depth_dive"]

[[tool.importlinter.contracts]]
name = "core must not import retrieval_qa, depth_dive, api, or ingestion"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["retrieval_qa", "depth_dive", "api", "ingestion"]

[[tool.importlinter.contracts]]
name = "retrieval_qa and depth_dive must not import api or ingestion"
type = "forbidden"
source_modules = ["retrieval_qa", "depth_dive"]
forbidden_modules = ["api", "ingestion"]

[[tool.importlinter.contracts]]
name = "ingestion must not import api"
type = "forbidden"
source_modules = ["ingestion"]
forbidden_modules = ["api"]
