[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-upstream"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "pydantic-settings>=2.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_upstream"]
